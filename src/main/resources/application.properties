server.port=8080
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=cloudfiles

server.servlet.context-path=/api/v1.0

spring.data.mongodb.auto-index-creation=true

# Optional: Show MongoDB queries in logs
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.UserDetailsServiceAutoConfiguration

clerk.issuer =${CLERK_ISSUER}
clerk.jwks-url=${CLERK_JWKS_URI}
#clerk.issuer =https://select-lioness-14.clerk.accounts.dev
#clerk.jwks-url=https://select-lioness-14.clerk.accounts.dev/.well-known/jwks.json

clerk.webhook.secret=${CLERK_WEBHOOK_SECRET}
#clerk.webhook.secret=ieQvSkub86EfdQPsRLOf4IFP1V3Vi62Q

#File upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

#razorpay settings
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
